<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>超算互联网 · 连接到 Magpie</title>
<style>
  :root { font-family: system-ui, sans-serif; color: #172033; background: #f3f6fb; color-scheme: light; }
  body { margin: 0; padding: 40px 18px; }
  main { max-width: 520px; margin: 0 auto; padding: 30px; background: white; border: 1px solid #dce4ef; border-radius: 20px; }
  .brand { color: #1259c3; font-weight: 650; } h1 { font-size: 25px; margin: 14px 0; }
  p { line-height: 1.7; color: #536078; } label { display: block; font-weight: 600; margin: 22px 0 8px; }
  select, input, button { box-sizing: border-box; font: inherit; border-radius: 9px; padding: 12px; }
  select, input { width: 100%; border: 1px solid #b9c7db; background: white; }
  button { border: 0; background: #1259c3; color: white; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .55; cursor: default; } :focus-visible { outline: 3px solid #78b5ff; outline-offset: 3px; }
  .primary { width: 100%; margin-top: 20px; } .secondary { background: #eaf0f9; color: #295285; }
  .note { font-size: 13px; }
  #error { color: #ad2525; } a { color: #1259c3; } [hidden] { display: none; }
  footer { border-top: 1px solid #e3e9f2; margin-top: 24px; padding-top: 16px; }
  @media (max-width: 430px) { main { padding: 22px 18px; } body { padding: 18px 12px; } }
</style>
<main>
  <div class="brand">scnet-auth · Magpie 社区插件</div>
  <h1 id="title">确认连接的套餐</h1>
  <p class="note">已从你的浏览器读取 SCNet 官网登录结果。此页只用于确认连接，不需要输入密码或短信验证码。</p>
  <section id="selection">
    <p id="account"></p>
    <p>确认后，现有 API Key 和额度会话将保存在本机 Magpie，供模型调用及额度查询使用。</p>
    <form id="connect">
      <label for="plan">Token Plan 套餐</label><select id="plan" required></select>
      <p id="detail" class="note"></p>
      <div id="custom" hidden><label for="models">套餐模型 ID</label><input id="models" placeholder="多个模型用逗号分隔"><p class="note">此套餐未返回模型列表，请填写套餐支持的完整模型 ID。</p></div>
      <button id="submit" type="submit" class="primary">连接到 Magpie</button>
    </form>
  </section>
  <p><button id="refresh" class="secondary" type="button">切换账号后，重新读取</button></p>
  <p class="note">如账号不对，请在刚打开的 SCNet 官网切换账号，再重新读取。</p>
  <p id="error" role="alert"></p>
  <p id="result" role="status" hidden></p>
  <footer><button id="cancel" class="secondary" type="button">取消连接</button><p class="note" id="expiry">本页有效期为 5 分钟。关闭页面后，未完成的连接会在到期时自动取消。</p></footer>
</main>
<script nonce="__NONCE__">
  const byId = id => document.getElementById(id);
  let secret = location.hash.slice(1), choices = [], timer, ended = false;
  history.replaceState(null, '', location.pathname);
  async function request(path, body = {}) {
    const response = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-SCNet-Login': secret }, body: JSON.stringify(body), cache: 'no-store' });
    const data = await response.json();
    if (!response.ok) throw Error(data.error || '请求未完成，请重试');
    return data;
  }
  function failed(error) { byId('error').textContent = error instanceof TypeError ? '本机连接已结束或超时，请返回 Magpie 重新登录。' : error.message; }
  function done(message) {
    ended = true; secret = ''; clearTimeout(timer);
    byId('selection').hidden = true;
    byId('cancel').hidden = byId('refresh').hidden = true; byId('expiry').hidden = true;
    byId('title').textContent = message; byId('error').textContent = '';
    byId('result').hidden = false; byId('result').textContent = '现在可以关闭此页面，返回 Magpie。';
  }
  async function load() {
    byId('submit').disabled = true;
    try {
      const data = await request('/account');
      if (ended) return;
      if (!data.ready) {
        byId('account').textContent = '等待官网登录完成，请在官网标签页继续。';
        timer = setTimeout(load, 1500); return;
      }
      choices = data.choices;
      byId('account').textContent = '已登录：' + data.user; byId('plan').replaceChildren();
      for (const plan of choices) { const option = document.createElement('option'); option.value = plan.id; option.textContent = plan.name + (choices.length > 1 ? ' · ' + plan.id : ''); byId('plan').append(option); }
      byId('plan').dispatchEvent(new Event('change')); byId('submit').disabled = false;
    } catch (error) { failed(error); }
  }
  byId('refresh').addEventListener('click', async () => {
    byId('refresh').disabled = true; byId('submit').disabled = true; byId('error').textContent = ''; clearTimeout(timer);
    try { await request('/refresh'); await load(); }
    catch (error) { failed(error); }
    finally { byId('refresh').disabled = false; }
  });
  byId('plan').addEventListener('change', () => {
    const plan = choices.find(p => p.id === byId('plan').value); if (!plan) return;
    byId('custom').hidden = !!plan.models; byId('models').required = !plan.models;
    byId('detail').textContent = (plan.until ? '到期：' + new Date(plan.until).toLocaleString('zh-CN') + '。' : '') + (plan.models ? '模型：' + plan.models.split(',').join('、') : '');
  });
  byId('connect').addEventListener('submit', async event => {
    event.preventDefault(); byId('submit').disabled = true; byId('error').textContent = '';
    try { await request('/choose', { id: byId('plan').value, models: byId('models').value }); done('账号已连接'); }
    catch (error) { failed(error); byId('submit').disabled = false; }
  });
  byId('cancel').addEventListener('click', async () => {
    byId('cancel').disabled = true;
    try { await request('/cancel'); done('已取消连接'); }
    catch (error) { failed(error); byId('cancel').disabled = false; }
  });
  if (!secret) { byId('error').textContent = '请从 Magpie 重新打开登录页；直接刷新或复制此地址无法继续连接。'; byId('cancel').disabled = byId('refresh').disabled = byId('submit').disabled = true; }
  else load();
</script>
</html>
